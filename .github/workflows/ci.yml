name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/iw
      - name: install smoke
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install ./cmd/iw
          "$RUNNER_TEMP/bin/iw" version --json | grep -q '"schema":"iw.command-result/v2"'
          "$RUNNER_TEMP/bin/iw" capabilities --json | grep -q '"schema":"iw.capabilities/v1"'
          "$RUNNER_TEMP/bin/iw" capabilities --json | grep -q '"command_result_schema":"iw.command-result/v2"'
          "$RUNNER_TEMP/bin/iw" capabilities --json | grep -q '"machine_semantics_schema":"iw.machine-semantics/v1"'
          "$RUNNER_TEMP/bin/iw" capabilities --json | grep -q '"context_schema":"iw.context/v1"'
